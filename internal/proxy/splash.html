<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CyAc</title>
<style>
  /* CyAc design system, Void theme: bg, ink and the label-tracked style. */
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: grid; place-items: center; }
  p {
    margin: 0;
    padding-left: 0.4em; /* balances the tracking after the last letter */
    color: #ecece6;
    font: 400 11px/16px "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>
<p>[ Everything runs on CyberAcme ]</p>
</body>
</html>

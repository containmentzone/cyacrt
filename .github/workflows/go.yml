name: go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The latest release, and the Go line NixOS stable (26.05) ships.
        go: [stable, 1.26.x]
    # Fail instead of downloading a newer Go when go.mod asks for one.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

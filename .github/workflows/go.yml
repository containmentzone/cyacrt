name: go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The latest Go release; go.mod's go line is only the minimum.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

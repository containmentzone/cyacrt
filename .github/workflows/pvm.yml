# Boots a box under firecracker-pvm inside a VM with VMX hidden (see
# nix/test-pvm.nix). Builds the PVM host kernel, so it's slow; it only runs
# when something PVM depends on changes.
name: pvm

on:
  pull_request:
    paths:
      - flake.nix
      - nix/**
      - cmd/**
      - internal/**
      - go.*
      - .github/workflows/pvm.yml
  workflow_dispatch:

jobs:
  pvm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the kernel build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build .#checks.x86_64-linux.pvm -L

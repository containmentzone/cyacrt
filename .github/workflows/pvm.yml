# Boots a box under cloud-hypervisor-pvm inside a VM with VMX hidden (see
# nix/test-pvm.nix). Builds the PVM host kernel, which takes over an hour,
# so it only runs when started by hand from the Actions tab.
name: pvm

on:
  workflow_dispatch:

concurrency:
  group: pvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pvm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the kernel build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # GitHub's archive downloads of the PVM kernel source get 429s on
      # shared runners, with or without a token. Fetch the one commit over
      # git instead, keep it in the Actions cache, and put it in the store
      # under the fixed-output path fetchFromGitHub would make, so nix skips
      # its own download. If the path ever doesn't match, nix fetches as before.
      - name: Find the PVM kernel revision
        id: pvm
        run: echo "rev=$(sed -n 's/.*rev = "\([0-9a-f]*\)";.*/\1/p' nix/pvm.nix)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: pvm-cache
        with:
          path: ~/pvm-src.tar.gz
          key: pvm-src-${{ steps.pvm.outputs.rev }}
      - name: Fetch the PVM kernel source
        if: steps.pvm-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ~/pvm-git
          git -C ~/pvm-git fetch -q --depth 1 https://github.com/virt-pvm/linux ${{ steps.pvm.outputs.rev }}
          git -C ~/pvm-git archive --format=tar.gz -o ~/pvm-src.tar.gz FETCH_HEAD
          rm -rf ~/pvm-git
      - uses: actions/cache/save@v4
        if: steps.pvm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/pvm-src.tar.gz
          key: pvm-src-${{ steps.pvm.outputs.rev }}
      - name: Add the PVM kernel source to the store
        run: |
          mkdir "$RUNNER_TEMP/source"
          tar -C "$RUNNER_TEMP/source" -xzf ~/pvm-src.tar.gz
          nix-store --add-fixed --recursive sha256 "$RUNNER_TEMP/source"
          rm -rf "$RUNNER_TEMP/source" ~/pvm-src.tar.gz
      - run: nix build .#checks.x86_64-linux.pvm -L
